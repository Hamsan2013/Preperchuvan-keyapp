plugins {
    id 'com.android.application'
}

android {
    namespace 'com.preperchuvan.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.preperchuvan.keyboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // No external tracking, ads, or unnecessary UI libraries.
}
